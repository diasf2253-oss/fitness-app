<!doctype html>
<!--
  Dev-only iPhone preview. Open http://localhost:5173/phone.html while
  `npm run dev` is running. The app runs inside an <iframe> exactly 390 px wide
  (an iPhone 14's viewport), so the mobile layout, bottom nav and touch-sized
  controls show up the way they do on the phone. This file is NOT part of the
  production build (vite only builds index.html), so it never ships.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracker — iPhone 14 preview</title>
  <style>
    :root { --w: 390px; --h: 844px; --bezel: 13px; --status: 47px; --home: 34px; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; gap: 1rem;
      padding: 2rem 1rem; background: #e9e9ea; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #6b6b70;
    }
    .stage { display: grid; justify-items: center; gap: 1rem; transform-origin: top center; }
    .phone {
      width: calc(var(--w) + var(--bezel) * 2);
      height: calc(var(--h) + var(--bezel) * 2);
      padding: var(--bezel);
      border-radius: 62px;
      background: #0b0b0c;
      box-shadow: 0 0 0 2px #8e8e93, 0 0 0 5px #2a2a2c, 0 30px 70px rgba(0, 0, 0, 0.35);
      position: relative;
    }
    /* side buttons */
    .phone::before, .phone::after { content: ''; position: absolute; width: 4px; background: #2a2a2c; border-radius: 2px; }
    .phone::before { left: -7px; top: 150px; height: 56px; box-shadow: 0 78px 0 #2a2a2c; }
    .phone::after  { right: -7px; top: 200px; height: 90px; }
    .screen {
      width: var(--w); height: var(--h);
      border-radius: 49px; overflow: hidden; position: relative; background: #111a19;
    }
    /* status bar strip: the app's safe-area padding is 0 inside an iframe, so
       the app starts below this strip instead of under the notch */
    .status {
      height: var(--status); display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 30px 6px; color: #fff; font-weight: 600; font-size: 15px; background: #111a19;
    }
    .status svg { display: block; }
    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 162px; height: 31px; background: #0b0b0c; border-radius: 0 0 20px 20px; z-index: 3;
    }
    iframe { display: block; width: var(--w); height: calc(var(--h) - var(--status) - var(--home)); border: 0; background: #111a19; }
    .home { height: var(--home); background: #111a19; display: grid; place-items: center; }
    .home i { width: 134px; height: 5px; border-radius: 3px; background: #fff; opacity: 0.85; }
    .bar { display: flex; gap: 0.75rem; align-items: center; }
    button { font: inherit; padding: 0.35rem 0.8rem; border-radius: 999px; border: 1px solid #c4c4c8; background: #fff; cursor: pointer; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="notch"></div>
        <div class="status">
          <span id="clock">9:41</span>
          <span style="display:flex;gap:6px;align-items:center">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#fff" opacity=".5"/></svg>
          </span>
        </div>
        <iframe id="app" src="/" title="App preview"></iframe>
        <div class="home"><i></i></div>
      </div>
    </div>
    <div class="bar">
      <span>iPhone 14 · 390 × 844</span>
      <button id="reload" type="button">Reload</button>
      <a href="/">Open full size</a>
    </div>
  </div>
  <script>
    const clock = () => { const d = new Date(); document.getElementById('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0'); };
    clock(); setInterval(clock, 15000);
    document.getElementById('reload').onclick = () => document.getElementById('app').contentWindow.location.reload();
    // Shrink to fit short laptop screens
    const fit = () => { const s = Math.min(1, (innerHeight - 40) / 960); document.getElementById('stage').style.transform = `scale(${s})`; };
    fit(); addEventListener('resize', fit);
  </script>
</body>
</html>
